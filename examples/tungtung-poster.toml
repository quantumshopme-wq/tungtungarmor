# tungtungarmor config -- konversi dari build2.bat (PyArmor) "TungTung Poster".
#
# Taruh file ini sebagai  tungtungarmor.toml  di root project (D:\Tool\Auto Upload),
# lalu cukup jalankan:
#
#     tungtungarmor pyinstaller
#
# Catatan:
# * --hidden-import pyarmor_runtime_009542 TIDAK perlu -- tungtungarmor menyuntik
#   runtime-nya sendiri secara otomatis.
# * Pemisah --add-data pakai ';' (Windows). Kalau build di Linux/macOS ganti ke ':'.

output = "dist_protected"
optimize = 2

# follow-imports sudah DEFAULT: tungtungarmor menelusuri import dari entry
# (main.py) dan HANYA mengobfuscate modul milik project (seperti PyArmor),
# jadi file tak terkait (debug_app, scratch, .venv, dll) otomatis diabaikan.
# Tidak perlu menulis apa pun. Untuk mematikan: follow_imports = false
#
# Untuk import dinamis yang tidak terlihat scanner (importlib/plugin), tambahkan
# di sini sebagai nama modul atau glob, mis: include = ["plugins/*.py"]
include = []

[pyinstaller]
entry = "main.py"
project_root = "."
name = "TungTung Poster"
onedir = true            # setara `pyarmor gen --pack onedir`
windowed = true          # setara -w
icon = "assets/icons/TungTungPoster.ico"
noupx = true

# Catatan: tungtungarmor OTOMATIS menambahkan --hidden-import untuk:
#   * semua modul LOKAL project (api_server, core, utils, ui, automations, ...)
#   * semua import THIRD-PARTY yang terlihat di source Anda (mis moviepy.editor,
#     fastapi, numpy, dst) -- karena source terenkripsi, PyInstaller tak bisa
#     melihatnya sendiri.
# Jadi daftar di bawah hanya perlu untuk modul yang di-import SECARA DINAMIS di
# dalam library-nya (tidak muncul di source Anda), mis uvicorn.loops.auto.
# Boleh dibiarkan lengkap sebagai pengaman.
hidden_imports = [
    "adbutils", "certifi", "fastapi", "cffi",
    "charset_normalizer", "customtkinter", "imageio", "IPython", "lxml",
    "markupsafe", "moviepy", "numpy", "openpyxl", "pandas", "PIL", "psutil",
    "pydantic", "py", "dateutil", "pytz", "requests", "retry", "setuptools",
    "uiautomator2", "websocket", "watchdog", "selenium",
    "undetected_chromedriver", "cv2", "tkcalendar",
    "webdriver_manager.core.os_manager",
    "selenium.webdriver.common.service", "selenium.webdriver.chrome.service",
    "pathlib", "urllib3", "packaging", "packaging.version",
    "uvicorn", "uvicorn.logging", "uvicorn.loops", "uvicorn.loops.auto",
    "uvicorn.protocols", "uvicorn.protocols.http", "uvicorn.protocols.http.auto",
    "uvicorn.protocols.http.h11", "uvicorn.lifespan", "uvicorn.lifespan.on",
    "anyio", "anyio.backends._asyncio", "uvicorn.protocols.http.h11_impl",
    "uvicorn.protocols.websockets.websockets_impl", "uvicorn.selectors",
    "starlette",
]

collect_data = ["pandas", "uiautomator2", "imageio"]

copy_metadata = [
    "imageio", "moviepy", "numpy", "Pillow", "pandas", "uiautomator2",
    "adbutils", "fastapi", "uvicorn", "starlette", "pydantic", "requests",
    "packaging",
]

add_data = [
    "assets;assets",
    "templates;templates",
    "dist_sniper;dist_sniper",
    "locales;locales",
]
