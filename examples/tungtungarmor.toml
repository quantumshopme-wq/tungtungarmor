# Example tungtungarmor config.
# Run from this directory:  tungtungarmor pyinstaller
# (entry/output are read from here, so no long command line is needed)

# --- obfuscation options (top level) ---
output = "dist_protected"
encrypt_strings = true
rename_locals = false
optimize = 2
runtime_pkg = "tungtungarmor_runtime"

# --- PyInstaller build options ---
[pyinstaller]
entry = "hello.py"
project_root = "."
name = "TungTung Poster"
onedir = true        # false => one-file
windowed = false     # true  => no console window (GUI apps)
# icon = "assets/icons/app.ico"
noupx = true

# These long lists used to live on one giant command line:
hidden_imports = [
    "api_server", "adbutils", "fastapi", "uvicorn", "uvicorn.loops.auto",
    "uvicorn.protocols.http.auto", "anyio.backends._asyncio",
    "pandas", "numpy", "PIL", "customtkinter", "selenium",
]
collect_data = ["pandas", "uiautomator2", "imageio"]
collect_submodules = ["uvicorn"]
copy_metadata = ["numpy", "Pillow", "pandas", "fastapi", "uvicorn", "starlette"]
add_data = [
    "assets;assets",       # use ':' instead of ';' on Linux/macOS
    "templates;templates",
    "locales;locales",
]

# Any remaining raw flags, PyArmor pyi_options style:
pyi_options = ""
# Or already-tokenised extras:
extra_args = []
